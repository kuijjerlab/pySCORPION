[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscorpion"
version = "0.1.0"
description = "Constructs cell-type-specific gene regulatory networks from single-cell RNA-sequencing data using the SCORPION algorithm, which aggregates cells into super-cells and applies PANDA to infer transcription factor-target regulatory relationships."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Daniel Osorio", email = "daniecos@uio.no"},
    {name = "Marieke L. Kuijjer", email = "marieke.kuijjer@ncmbm.uio.no"},
]
keywords = [
    "single-cell",
    "gene-regulatory-networks",
    "transcription-factors",
    "transcriptomics",
    "SCORPION",
    "protein-protein-interaction",
    "cell-type-specific",
    "comparative-edge-analysis",
    "population-comparison",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "networkx>=2.6",
    "igraph>=0.10",
]

[project.optional-dependencies]
igraph = ["igraph>=0.10"]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/kuijjerlab/SCORPION"
Repository = "https://github.com/kuijjerlab/pySCORPION"

[tool.setuptools.packages.find]
include = ["scorpion*"]
exclude = ["scorpion.tests*", "scorpion.scorpion*"]

[tool.setuptools.package-data]
"scorpion.data" = ["*.mtx", "*.txt", "*.csv"]

[tool.setuptools]
# Exclude .bak files from the distribution
exclude-package-data = {"*" = ["*.bak"]}

[tool.pytest.ini_options]
testpaths = ["scorpion/tests"]
