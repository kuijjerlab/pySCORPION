# Continuous delivery: on a version tag, test and build the sdist and wheel,
# publish them to PyPI and attach them to a GitHub release.
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

name: release

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tags may be written as 1.2.3, v1.2.3 or v.1.2.3.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' scorpion/__init__.py)
          tag_version=${GITHUB_REF_NAME#v}
          tag_version=${tag_version#.}
          if [ "$pkg_version" != "$init_version" ]; then
            echo "::error::pyproject.toml version $pkg_version does not match scorpion/__init__.py version $init_version"
            exit 1
          fi
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $pkg_version"
            exit 1
          fi

      - name: Run test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pytest -v

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import scorpion; d = scorpion.load_example_data(); print(scorpion.__version__, d['gex_matrix'].shape)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Uses PyPI trusted publishing (OIDC); no API token is stored in the repo.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyscorpion/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
