# Continuous integration: test suite on Linux, macOS and Windows, plus a
# build check of the sdist and wheel.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: CI

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (Python ${{ matrix.python }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - {os: macos-latest,   python: '3.12'}
          - {os: windows-latest, python: '3.12'}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run test suite
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # Run from outside the checkout so the installed wheel is imported,
      # confirming the example data ships with the package.
      - name: Smoke-test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import scorpion; d = scorpion.load_example_data(); print(scorpion.__version__, d['gex_matrix'].shape)"
